[package]
name = "aws-cli"
version = "0.1.0"
edition = "2021"
authors = ["Jonathan D.A. Jewell <j.d.a.jewell@open.ac.uk>"]
description = "Command-line interface for the Academic Workflow Suite"
license = "MPL-2.0"
repository = "https://github.com/yourusername/academic-workflow-suite"

[[bin]]
name = "aws"
path = "src/main.rs"

[dependencies]
futures = "0.3"
# CLI argument parsing
clap = { version = "4.4", features = ["derive", "cargo", "env"] }

# Terminal output
colored = "2.2"
console = "0.16"
indicatif = "0.17"
dialoguer = "0.11"

# HTTP client
reqwest = { version = "0.12", features = ["json", "blocking", "cookies", "multipart", "stream"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"

# Async runtime
tokio = { version = "1.35", features = ["full"] }

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# File system
dirs = "5.0"
walkdir = "2.4"

# Date and time
chrono = { version = "0.4", features = ["serde"] }

# Other utilities
lazy_static = "1.4"
regex = "1.10"

[dev-dependencies]
mockito = "1.2"
tempfile = "3.8"
proptest = "1.4"

[profile.release]
lto = true
codegen-units = 1
opt-level = "z"
strip = true
