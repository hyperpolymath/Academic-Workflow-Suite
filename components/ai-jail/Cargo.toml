[package]
name = "ai-jail"
version = "0.1.0"
edition = "2021"
authors = ["Jonathan D.A. Jewell <j.d.a.jewell@open.ac.uk>"]
description = "Network-isolated AI inference container for TMA grading"
license = "MPL-2.0"

[[bin]]
name = "ai-jail"
path = "src/main.rs"

[dependencies]
# Candle ML framework
candle-core = { version = "0.11", features = ["cuda"] }
candle-nn = "0.11"
candle-transformers = "0.11"

# Tokenization
tokenizers = { version = "0.23", default-features = false, features = ["onig"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling
anyhow = "1.0"
thiserror = "2.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Utilities
hf-hub = { version = "1.0", features = ["tokio"] }

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.0"
tempfile = "3.8"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true

[profile.release-with-debug]
inherits = "release"
strip = false
debug = true
