#
# Stapeln service definition for academic-workflow-suite
# ai-jail runs on an isolated internal network with no external access
#
# Usage:
#   podman-compose -f selur-compose.toml up -d
#   just stack-up

[project]
name = "academic-workflow-suite"

[services.postgres]
image = "postgres:16-alpine"
restart = "unless-stopped"
networks = ["aws-network"]
ports = ["5432:5432"]
environment = { POSTGRES_DB = "academic_workflow", POSTGRES_USER = "aws_user", POSTGRES_PASSWORD = "${POSTGRES_PASSWORD:-changeme123}", POSTGRES_INITDB_ARGS = "--encoding=UTF8 --locale=en_US.UTF-8" }
volumes = [
  "postgres-data:/var/lib/postgresql/data",
  "./docker/configs/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro",
  "./docker/configs/postgres/setup-replication.sql:/docker-entrypoint-initdb.d/02-replication.sql:ro",
]
healthcheck = { test = ["CMD-SHELL", "pg_isready -U aws_user -d academic_workflow"], interval = "10s", timeout = "5s", retries = 5 }

[services.redis]
image = "cgr.dev/chainguard/redis:latest"
restart = "unless-stopped"
networks = ["aws-network"]
ports = ["6379:6379"]
command = "redis-server --appendonly yes --appendfsync everysec --maxmemory 512mb --maxmemory-policy allkeys-lru"
volumes = [
  "redis-data:/data",
  "./docker/configs/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro",
]
healthcheck = { test = ["CMD", "redis-cli", "ping"], interval = "10s", timeout = "5s", retries = 5 }

[services.adminer]
image = "adminer:latest"
restart = "unless-stopped"
networks = ["aws-network"]
ports = ["8081:8080"]
environment = { ADMINER_DEFAULT_SERVER = "postgres", ADMINER_DESIGN = "pepa-linha" }
healthcheck = { test = ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080"], interval = "30s", timeout = "10s", retries = 3 }

[services.core]
build = { context = ".", dockerfile = "dockerfiles/Dockerfile.core" }
restart = "unless-stopped"
networks = ["aws-network", "ai-jail-network"]
ports = ["8080:8080"]
environment = { RUST_LOG = "info", AWS_ENV = "production", API_HOST = "0.0.0.0", API_PORT = "8080", LMDB_PATH = "/data/lmdb", AI_JAIL_SOCKET = "/run/ai-jail.sock", REDIS_URL = "redis://redis:6379" }
volumes = [
  "lmdb-data:/data/lmdb",
  "ai-jail-socket:/run",
  "./config:/app/config:ro",
]
healthcheck = { test = ["CMD", "curl", "-f", "http://localhost:8080/health"], interval = "15s", timeout = "10s", retries = 3 }

[services.backend]
build = { context = ".", dockerfile = "dockerfiles/Dockerfile.backend" }
restart = "unless-stopped"
networks = ["aws-network"]
ports = ["4000:4000"]
environment = { MIX_ENV = "prod", PHX_HOST = "backend", PHX_SERVER = "true", PORT = "4000", DATABASE_URL = "postgresql://aws_user:${POSTGRES_PASSWORD:-changeme123}@postgres:5432/academic_workflow", REDIS_URL = "redis://redis:6379", SECRET_KEY_BASE = "${SECRET_KEY_BASE}" }
volumes = ["./config:/app/config:ro"]
healthcheck = { test = ["CMD", "curl", "-f", "http://localhost:4000/api/health"], interval = "15s", timeout = "10s", retries = 3 }

[services.ai-jail]
build = { context = ".", dockerfile = "dockerfiles/Dockerfile.ai-jail" }
restart = "unless-stopped"
networks = ["ai-jail-network"]
environment = { RUST_LOG = "info", AI_JAIL_MODE = "true", SOCKET_PATH = "/run/ai-jail.sock", MODEL_PATH = "/models" }
volumes = [
  "ai-models:/models:ro",
  "ai-jail-socket:/run",
]
# Critical isolation: drop all caps, read-only root, tmpfs for /tmp
cap_drop = ["ALL"]
cap_add = ["CHOWN", "DAC_OVERRIDE", "SETGID", "SETUID"]
security_opt = ["no-new-privileges:true", "seccomp=./docker/configs/seccomp/ai-jail.json"]
read_only = true
tmpfs = ["/tmp:size=1G,mode=1777,noexec,nosuid,nodev"]

[services.nginx]
build = { context = ".", dockerfile = "dockerfiles/Dockerfile.nginx" }
restart = "unless-stopped"
networks = ["aws-network"]
ports = ["80:80", "443:443"]
volumes = [
  "./docker/configs/nginx/nginx.conf:/etc/nginx/nginx.conf:ro",
  "./docker/configs/nginx/conf.d:/etc/nginx/conf.d:ro",
  "./docker/configs/nginx/ssl:/etc/nginx/ssl:ro",
  "./docker/configs/nginx/html:/usr/share/nginx/html:ro",
]
healthcheck = { test = ["CMD", "curl", "-f", "http://localhost/health"], interval = "15s", timeout = "5s", retries = 3 }

[services.prometheus]
image = "prom/prometheus:latest"
restart = "unless-stopped"
networks = ["aws-network"]
ports = ["9090:9090"]
command = ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.path=/prometheus", "--storage.tsdb.retention.time=30d", "--web.enable-lifecycle"]
volumes = [
  "./docker/configs/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro",
  "./docker/configs/prometheus/alerts:/etc/prometheus/alerts:ro",
  "prometheus-data:/prometheus",
]

[services.grafana]
image = "grafana/grafana:latest"
restart = "unless-stopped"
networks = ["aws-network"]
ports = ["3000:3000"]
environment = { GF_SECURITY_ADMIN_USER = "admin", GF_SECURITY_ADMIN_PASSWORD = "${GRAFANA_PASSWORD:-admin}", GF_USERS_ALLOW_SIGN_UP = "false", GF_ANALYTICS_REPORTING_ENABLED = "false", GF_ANALYTICS_CHECK_FOR_UPDATES = "false" }
volumes = [
  "grafana-data:/var/lib/grafana",
  "./docker/configs/grafana/provisioning:/etc/grafana/provisioning:ro",
  "./docker/configs/grafana/dashboards:/var/lib/grafana/dashboards:ro",
]
healthcheck = { test = ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/api/health"], interval = "30s", timeout = "10s", retries = 3 }

[volumes]
postgres-data = {}
redis-data = {}
lmdb-data = {}
ai-models = {}
ai-jail-socket = {}
prometheus-data = {}
grafana-data = {}

[networks]
aws-network = { driver = "bridge" }
# ai-jail-network is internal: no external network access for AI isolation
ai-jail-network = { driver = "bridge", internal = true }
